#集群管理脚本的自动测试：改了路由器同步脚本、固件里的集群设置时自动跑（几十秒）
name: Fleet-Tests

on:
  push:
    paths:
      - 'Scripts/fleet/**'
      - 'Scripts/Fleet.sh'
      - 'Scripts/Tailscale.sh'
      - 'Scripts/Packages.sh'
      - '.github/workflows/fleet-tests.yml'
  pull_request:
    paths:
      - 'Scripts/fleet/**'
      - 'Scripts/Fleet.sh'
      - 'Scripts/Tailscale.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Fleet agent unit tests
        run: |
          python3 -m pip install --quiet --user lupa
          python3 -m unittest discover -s Scripts/fleet/tests -v

      - name: Shell syntax
        run: |
          bash -n Scripts/Fleet.sh
          bash -n Scripts/Tailscale.sh
          bash -n Scripts/Packages.sh
          sh -n Scripts/fleet/screen-defaults.sh

      - name: Generated firmware files
        run: |
          # 用假的 curl 跑一遍 Fleet.sh（不下载国内名单），检查生成的开机脚本语法
          mkdir -p /tmp/fake-bin /tmp/fleet-wrt
          printf '#!/bin/sh\nout=""\nwhile [ $# -gt 0 ]; do case "$1" in -o) out="$2"; shift;; esac; shift; done\n{ printf SRS; head -c 20000 /dev/zero; } > "$out"\n' > /tmp/fake-bin/curl
          chmod +x /tmp/fake-bin/curl
          cd /tmp/fleet-wrt
          PATH=/tmp/fake-bin:$PATH GITHUB_WORKSPACE=$GITHUB_WORKSPACE WRT_VER=0.0.0 WRT_DATE=26.01.01-00.00.00 bash $GITHUB_WORKSPACE/Scripts/Fleet.sh
          for f in files/etc/uci-defaults/* files/etc/init.d/*; do sh -n "$f"; done
          test -x files/www/fleet-setup/cgi-bin/api
          grep -q '/usr/share/fleet/fleet-setup.lua' files/www/fleet-setup/cgi-bin/api
          test -s files/www/fleet-setup/index.html
          test -s files/www/fleet-setup/portal.html
          grep -q "error_page='/cgi-bin/api?a=probe'" files/etc/uci-defaults/98-fleet-setup
          grep -q '/etc/fleet/portal-clients.json' files/lib/upgrade/keep.d/fleet

      - name: sing-box accepts the generated configs (pinned version)
        run: |
          VER=$(grep -oP '^SING_BOX_VERSION="\K[^"]+' Scripts/Packages.sh)
          COMMIT=$(grep -oP '^SING_BOX_COMMIT="\K[^"]+' Scripts/Packages.sh)
          echo "sing-box 锁定版本：$VER（$COMMIT）"
          git clone -q --depth 1 --branch "v$VER" https://github.com/SagerNet/sing-box /tmp/sing-box
          test "$(git -C /tmp/sing-box rev-parse HEAD)" = "$COMMIT" || { echo "::error::v$VER 指向的提交变了"; exit 1; }
          (cd /tmp/sing-box && go build -tags with_utls,with_gvisor -o /tmp/sb ./cmd/sing-box)
          python3 Scripts/fleet/tests/check_configs.py /tmp/sb
